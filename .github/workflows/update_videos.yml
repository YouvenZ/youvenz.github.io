name: "Pipeline 3 — Update Videos"

on:
  schedule:
    - cron: "0 7 * * *"   # daily at 07:00 UTC
  workflow_dispatch:

jobs:
  update-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch channel metadata (yt-dlp)
        env:
          YOUTUBE_CHANNEL_ID: "UCpT8vuVv62-VWoy8wTsABsw"
        run: python scripts/youtube_channel_metadata_pipeline.py

      - name: Convert CSV to videos.yaml
        run: python scripts/csv_to_videos_yaml.py scripts/youtube_metadata.csv
