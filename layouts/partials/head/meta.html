<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>!function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t)}()</script>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.bio }}{{ end }}{{ end }}">
<meta name="author" content="{{ .Site.Params.name }}">
{{ if .Params.noindex }}<meta name="robots" content="noindex">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" type="application/rss+xml" href="{{ "/index.xml" | absURL }}" title="{{ .Site.Title }}">
{{ if .IsSection }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}index.xml" title="{{ .Title }} — {{ .Site.Title }}">{{ end }}
