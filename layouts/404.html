{{ define "main" }}
<div class="error-page">
  <div class="error-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <div class="error-actions">
    <a href="{{ "/" | relURL }}" class="btn btn-primary">Go Home</a>
    {{ if .Site.Params.search }}
    <button class="btn btn-secondary" id="search-404-btn">Search the site</button>
    <script>
      document.getElementById('search-404-btn')?.addEventListener('click', function () {
        document.getElementById('search-toggle')?.click();
      });
    </script>
    {{ end }}
  </div>
</div>
{{ end }}
