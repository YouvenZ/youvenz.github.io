<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <rect width="120" height="80" rx="8" fill="#313244"/>
  <!-- Eye / OCT retinal scan icon -->
  <g transform="translate(60, 28)">
    <ellipse cx="0" cy="0" rx="16" ry="8" fill="none" stroke="#fab387" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#fab387" opacity="0.7"/>
    <circle cx="0" cy="0" r="2.5" fill="#fab387"/>
    <!-- scan lines -->
    <line x1="-16" y1="-12" x2="-16" y2="12" stroke="#fab387" stroke-width="1" opacity="0.4"/>
    <line x1="16" y1="-12" x2="16" y2="12" stroke="#fab387" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="60" y="58" font-family="sans-serif" font-size="8" fill="#fab387" text-anchor="middle" font-weight="bold">MARIO</text>
  <text x="60" y="70" font-family="sans-serif" font-size="7" fill="#9399b2" text-anchor="middle">AMD Challenge</text>
