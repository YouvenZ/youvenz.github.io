<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Timeline / longitudinal visualization -->
  <line x1="160" y1="220" x2="640" y2="220" stroke="#45475a" stroke-width="2"/>
  <circle cx="200" cy="220" r="10" fill="#89b4fa"/>
  <circle cx="340" cy="220" r="10" fill="#89b4fa"/>
  <circle cx="500" cy="220" r="10" fill="#94e2d5"/>
  <circle cx="620" cy="220" r="12" fill="#94e2d5" stroke="#a6f3e7" stroke-width="2"/>
  <!-- Connecting curves (latent trajectory) -->
  <path d="M200,180 Q270,140 340,160 Q420,145 500,155 Q560,148 620,158" fill="none" stroke="#94e2d5" stroke-width="2.5" opacity="0.8"/>
  <path d="M200,195 Q270,165 340,175 Q420,162 500,170 Q560,164 620,172" fill="none" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>
  <!-- t labels -->
  <text x="200" y="244" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">t₀</text>
  <text x="340" y="244" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">t₁</text>
  <text x="500" y="244" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">t₂</text>
  <text x="620" y="244" font-family="Inter,sans-serif" font-size="11" fill="#94e2d5" text-anchor="middle">t_n</text>
  <!-- MICCAI badge -->
  <rect x="260" y="365" width="280" height="36" rx="8" fill="#89b4fa" opacity="0.12" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="388" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#89b4fa" text-anchor="middle">MICCAI 2024 · Marrakesh</text>
  <!-- Title -->
  <text x="400" y="52" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#cdd6f4" text-anchor="middle">LatiM</text>
  <text x="400" y="74" font-family="Inter,sans-serif" font-size="12" fill="#7f849c" text-anchor="middle">Longitudinal Representation in Continuous-Time Models</text>
</svg>
