<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- DR grading scale visualization -->
  <rect x="180" y="180" width="65" height="80" rx="6" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <rect x="265" y="163" width="65" height="97" rx="6" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <rect x="350" y="148" width="65" height="112" rx="6" fill="#1e1e2e" stroke="#94e2d5" stroke-width="2.5"/>
  <rect x="435" y="170" width="65" height="90" rx="6" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <rect x="520" y="185" width="65" height="75" rx="6" fill="#1e1e2e" stroke="#45475a" stroke-width="2"/>
  <!-- Grade labels -->
  <text x="212" y="285" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">No DR</text>
  <text x="297" y="285" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">Mild</text>
  <text x="382" y="285" font-family="Inter,sans-serif" font-size="11" fill="#94e2d5" text-anchor="middle">Mod</text>
  <text x="467" y="285" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">Severe</text>
  <text x="552" y="285" font-family="Inter,sans-serif" font-size="11" fill="#7f849c" text-anchor="middle">PDR</text>
  <!-- SSL label -->
  <text x="382" y="168" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#94e2d5" text-anchor="middle">SSL</text>
  <!-- OMIA badge -->
  <rect x="240" y="368" width="320" height="36" rx="8" fill="#94e2d5" opacity="0.1" stroke="#94e2d5" stroke-width="1"/>
  <text x="400" y="391" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#94e2d5" text-anchor="middle">OMIA @ MICCAI 2022 · Singapore</text>
  <!-- Title -->
  <text x="400" y="52" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#cdd6f4" text-anchor="middle">DR Grading via Self-Supervised Learning</text>
  <text x="400" y="74" font-family="Inter,sans-serif" font-size="12" fill="#7f849c" text-anchor="middle">Diabetic Retinopathy · OMIA Workshop</text>
</svg>
